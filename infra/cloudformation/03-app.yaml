AWSTemplateFormatVersion: "2010-09-09"
Description: Ithemba - application (Lambda, API Gateway, CloudFront, EC2)
Resources: 
  DirectoryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: ithemba-directory-api
      Runtime: python3.13
      Handler: handler.lambda_handler
      Role: arn:aws:iam::022860393089:role/LabRole
      Code:
        S3Bucket: !ImportValue ithemba-services-deployment-name
        S3Key: lambda.zip
      Environment:
        Variables:
          TABLE_NAME: !ImportValue ithemba-services-table-name
  MaintenanceServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-0c2d3e23e757b5d84
      SubnetId: !ImportValue public-subnet-id
      SecurityGroupIds:
        - !ImportValue security-group-id
      IamInstanceProfile: LabInstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          mkdir -p /opt/ithemba
          cat > /opt/ithemba/validate.py << 'PYEOF'
          import json
          from pathlib import Path
          import re
          import sys

          required_fields = ["id", "name", "type", "province", "phone", "source_url", "last_verified"]
          valid_types = ["helpline", "police", "thuthuzela", "shelter", "legal", "clinic"]
          valid_provinces = ["national", "eastern-cape", "free-state", "gauteng", "kwazulu-natal",
                              "limpopo", "mpumalanga", "northern-cape", "north-west", "western-cape"]
          phone_numbers = re.compile(r"^[0-9*#+() -]{3,25}$")

          def validate_entries(entries):
              problems = []

              for entry in entries:
                  for field in required_fields:
                      if not entry.get(field):
                          problems.append(f"{entry.get('id', 'unknown')}: missing '{field}'")
                  if entry.get("type") and entry["type"] not in valid_types:
                      problems.append(f"{entry.get('id', 'unknown')}: unknown type '{entry['type']}'")
                  if entry.get("province") and entry["province"] not in valid_provinces:
                      problems.append(f"{entry.get('id', 'unknown')}: unknown province '{entry['province']}'")
                  if entry.get("phone") and not phone_numbers.match(entry.get("phone")):
                      problems.append(f"{entry.get('id', 'unknown')}: phone '{entry.get('phone')}' has an unexpected format")

              return problems

          if __name__ == "__main__":
              entries = json.loads(sys.stdin.read())
              print(f"{len(entries)} entries checked")
              problems = validate_entries(entries)
              for problem in problems:
                  print("PROBLEM:", problem)
              print(f"{len(problems)} problem(s) found")
              sys.exit(1 if problems else 0)
          PYEOF
          echo "0 6 * * * curl -s https://PLACEHOLDER.execute-api.${AWS::Region}.amazonaws.com/services | python3 /opt/ithemba/validate.py >> /var/log/ithemba-check.log 2>&1" > /etc/cron.d/ithemba-check
  DirectoryApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: ithemba-directory-api
      ProtocolType: HTTP
  DirectoryIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref DirectoryApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt DirectoryFunction.Arn
      PayloadFormatVersion: "2.0"
  DirectoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DirectoryApi
      RouteKey: GET /services
      Target: !Sub "integrations/${DirectoryIntegration}"
  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DirectoryFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DirectoryApi}/*/*"
  DirectoryStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref DirectoryApi
      StageName: $default
      AutoDeploy: true
Outputs:
  ApiUrl:
    Description: Base URL for the directory API
    Value: !Sub "https://${DirectoryApi}.execute-api.${AWS::Region}.amazonaws.com"
