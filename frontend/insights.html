<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ithemba - Insights</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="insights-page">

  <main>
    <h1>Ithemba</h1>
    <h2>Insights</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="insights.html">Insights</a>
    </nav>
    
    <div class="tabs">
      <button id="list-btn">List</button>
      <button id="summary-btn">Summary</button>
      <button id="trend-btn">Trend</button>
    </div>

    <select id="province-crime-filter">
      <option value="all">All provinces</option>
      <option value="national">National</option>
      <option value="eastern-cape">Eastern Cape</option>
      <option value="free-state">Free State</option>
      <option value="gauteng">Gauteng</option>
      <option value="kwazulu-natal">KwaZulu-Natal</option>
      <option value="limpopo">Limpopo</option>
      <option value="mpumalanga">Mpumalanga</option>
      <option value="north-west">North West</option>
      <option value="northern-cape">Northern Cape</option>
      <option value="western-cape">Western Cape</option>
    </select>

    <select id="crime-filter">
      <option value="all">All categories</option>
      <option value="Rape">Rape</option>
      <option value="Sexual assault">Sexual Assault</option>
      <option value="Attempted sexual offences">Attempted sexual offences</option>
      <option value="Contact sexual offences">Contact sexual offences</option>
      <option value="Sexual offences">Sexual offences</option>
      <option value="Sexual offences detected as a result of police action">Sexual offences detected as a result of police action</option>
    </select>

    <select id="year-filter">
      <option value="all">All Years</option>
      <option value="2020">2020</option>
      <option value="2021">2021</option>
      <option value="2022">2022</option>
      <option value="2023">2023</option>
      <option value="2024">2024</option>
      <option value="2025">2025</option>
    </select>

    <div id="list-view" class="view"></div>
    <div id="summary-view" class="view">
      <table></table>
    </div>
    <div id="trend-view" class="view"></div>
  </main>
  <script src="js/insights.js"></script>
</body>
</html>
